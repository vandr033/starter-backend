
name: Build Priconpri Backend

on:
  push:
    branches:
      - Reservas
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: priconpri-backend
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=priconpri-backend
          cache-to: type=gha,mode=max,scope=priconpri-backend


      - name: Build and push maintenance image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: maintenance
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:maintenance-latest
            ${{ env.IMAGE }}:maintenance-${{ github.sha }}
          cache-from: type=gha,scope=priconpri-backend
          cache-to: type=gha,mode=max,scope=priconpri-backend


      - name: Trigger Coolify deployment
        if: ${{ vars.ENABLE_COOLIFY_DEPLOY == 'true' }}
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "Missing Coolify credentials"
            exit 1
          fi

          curl --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --header "Accept: application/json"

